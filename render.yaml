# ARZIVE — Render Blueprint (two web services)
# After the GitHub repo exists: Render Dashboard → New → Blueprint → Connect repo → Apply.
# Docs: shopify is NOT deployed here. Study + API live on Render; storefront design is the Shopify theme.

services:
  - type: web
    name: arzive-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FRONTEND_ORIGIN
        fromService:
          name: arzive-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: LLM_MODEL
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_API_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-01"

  - type: web
    name: arzive-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: arzive-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_PROXY_TARGET
        fromService:
          name: arzive-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN
        value: arzive.org
      - key: NEXT_PUBLIC_SHOPIFY_CORNELL_HANDLE
        value: arzive-cornell-notebook
      - key: NEXT_PUBLIC_SHOPIFY_MATH_HANDLE
        value: arzive-math-notebook
      - key: NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_SHOPIFY_API_KEY
        sync: false
